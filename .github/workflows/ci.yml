# CI: typecheck and unit/browser tests on every pull request and push to main; the browser smoke test and the
# multi-instance check run on pushes to main. Render auto-deploys main, so protect main and require the
# "test" checks (see docs/deployment.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrikit
          POSTGRES_PASSWORD: nutrikit
          POSTGRES_DB: nutrikit
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nutrikit -d nutrikit"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://nutrikit:nutrikit@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: e2e
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: docker compose up -d --build --wait
      - run: npm test -w e2e
      - run: npm run multi-instance -w e2e
      - if: failure()
        run: docker compose logs app --tail 200
