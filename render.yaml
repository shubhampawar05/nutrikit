# Render Blueprint: one free web service serving the website, developer portal and API.
# The database is external (Supabase or any PostgreSQL 16+); see docs/deployment.md.
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked sync: false are asked for
# on the first deploy and kept out of git; later syncs never overwrite them.
services:
  - type: web
    name: nutrikit
    runtime: docker
    plan: free # sleeps after 15 minutes idle; the next request wakes it in about a minute
    region: frankfurt # close to the Supabase database in eu-west-1 (Ireland)
    branch: main
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    # The free plan has no pre-deploy step, so apply migrations at start (safe with a single instance).
    dockerCommand: node dist/cli/start.js
    healthCheckPath: /v1/health
    envVars:
      # Supabase -> Connect -> Session pooler (port 5432), with ?sslmode=require appended.
      - key: DATABASE_URL
        sync: false
      # Generate each with `openssl rand -hex 32`. Keep the token secret stable across deploys.
      - key: NUTRIKIT_TOKEN_SECRET
        sync: false
      # Bearer token for /admin.
      - key: NUTRIKIT_ADMIN_TOKEN
        sync: false
      - key: NUTRIKIT_SECURE_COOKIES
        value: "1"
      # Every request reaches the app through Render's proxy: trust that one hop for client addresses.
      - key: NUTRIKIT_TRUST_PROXY
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
