# Render Blueprint: one free web service serving the website, developer portal and API.
# The database is external (Supabase or any PostgreSQL 16+); see "Free deployment" in README.md.
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked sync: false are asked for
# on the first deploy; generateValue creates a random secret once and keeps it.
services:
  - type: web
    name: nutrikit
    runtime: docker
    plan: free # sleeps after 15 minutes idle; the next request wakes it in about a minute
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    # The free plan has no pre-deploy step, so apply migrations at start (safe with a single instance).
    dockerCommand: sh -c "node dist/cli/migrate.js && exec node dist/main.js"
    healthCheckPath: /v1/health
    envVars:
      # Supabase -> Connect -> Session pooler (port 5432), with ?sslmode=require appended.
      - key: DATABASE_URL
        sync: false
      - key: NUTRIKIT_TOKEN_SECRET
        generateValue: true
      # Bearer token for /admin; read it from the service's Environment tab.
      - key: NUTRIKIT_ADMIN_TOKEN
        generateValue: true
      - key: NUTRIKIT_SECURE_COOKIES
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
